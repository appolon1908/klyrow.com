# Host Nginx template. The host Nginx owner copies this file deliberately after
# backing up and reviewing the shared configuration (see README); it is never
# deployed automatically.
#
# Rate limiting at this layer is the only cross-replica, per-client limiter:
# the gateway's own limiter is per-process. Zones are split per vhost so that
# browser traffic on app.klyrow.com cannot exhaust the API's budget (or vice
# versa), and authentication paths get a much tighter per-IP zone so that
# credential stuffing is throttled before it reaches the gateway.
limit_req_zone $binary_remote_addr zone=klyrow_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=klyrow_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=klyrow_web_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=klyrow_api_auth:10m rate=5r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream klyrow_gateway {
  server 127.0.0.1:18000;
  keepalive 16;
}

upstream klyrow_web {
  server 127.0.0.1:18004;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name klyrow.com www.klyrow.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 308 https://app.klyrow.com$request_uri; }
}

server {
  listen 80;
  listen [::]:80;
  server_name app.klyrow.com api.klyrow.com track.klyrow.com bounce.klyrow.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 308 https://$host$request_uri; }
}

# The apex remains a redirect until the separately owned public website release
# is approved. It must never fall through to the application or tracking host.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name klyrow.com www.klyrow.com;
  ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 308 https://app.klyrow.com$request_uri;
}

# Browser UI and same-origin BFF. Activation requires the matching gateway and
# web release images; scripts/verify-browser-edge refuses incomplete releases.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.klyrow.com;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;
  client_max_body_size 25m;

  # Mautic's API and OAuth client-credentials endpoints are service-to-service
  # interfaces.  The Klyrow adapter reaches them over the private Compose
  # network; browser traffic must never expose the full upstream API catalog.
  location = /mautic/api { return 404; }
  location ^~ /mautic/api/ { return 404; }
  location = /mautic/oauth { return 404; }
  location ^~ /mautic/oauth/ { return 404; }

  location /mautic/ {
    proxy_pass http://127.0.0.1:18001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /ops { return 308 https://app.klyrow.com/ops/; }

  # Grafana is configured with serve_from_sub_path=true, so the /ops prefix
  # must reach the upstream unchanged.  A trailing slash on proxy_pass would
  # strip it and make Grafana generate /ops/ops redirects.
  location /ops/ {
    proxy_pass http://127.0.0.1:18003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 2m;
  }

  # Browser credential endpoints (BFF /auth/login, signup, step-up, MFA, OIDC
  # start/callback and e-mail action links). The web container proxies these
  # to the gateway; the tight zone applies instead of the general one.
  # /auth/session, /auth/refresh and /auth/logout stay on the general zone:
  # the SPA calls them on every page load.
  location ~ ^/auth/(login|signup|step-up|mfa|google|callback|actions)(/|$) {
    limit_req zone=klyrow_web_auth burst=10 nodelay;
    proxy_pass http://klyrow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
  }

  location / {
    limit_req zone=klyrow_web burst=30 nodelay;
    proxy_pass http://klyrow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
  }
}

# Public API only. Browser authentication and SPA routes are deliberately not
# exposed from this hostname even though they share the gateway process.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.klyrow.com;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location ~ ^/(auth|app|admin|login|signup|onboarding)(/|$) { return 404; }
  # API credential endpoints (/v1/auth/login, /v1/auth/forgot-password, ...).
  location ~ ^/v1/auth(/|$) {
    limit_req zone=klyrow_api_auth burst=10 nodelay;
    proxy_pass http://klyrow_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
  }
  location / {
    limit_req zone=klyrow_api burst=30 nodelay;
    proxy_pass http://klyrow_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;
  }
}

# Tracking serves only opaque tracking tokens. It can never render the SPA or
# initiate OIDC, which prevents sender-domain tracking aliases from becoming an
# alternative application origin.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name track.klyrow.com;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location ^~ /t/ {
    limit_req zone=klyrow_api burst=30 nodelay;
    proxy_pass http://klyrow_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }
  location / { return 404; }
}

# Bounce is a transport identity, not a browser application origin.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name bounce.klyrow.com;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/klyrow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/klyrow.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / { return 404; }
}
