{
  "components": {
    "parameters": {
      "CorrelationId": {
        "in": "header",
        "name": "X-Correlation-Id",
        "required": false,
        "schema": {
          "pattern": "^[A-Za-z0-9_-]{1,128}$",
          "type": "string"
        }
      },
      "Cursor": {
        "in": "query",
        "name": "cursor",
        "schema": {
          "maxLength": 2048,
          "type": "string"
        }
      },
      "IdempotencyKey": {
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 200,
          "minLength": 8,
          "type": "string"
        }
      },
      "Limit": {
        "in": "query",
        "name": "limit",
        "schema": {
          "default": 50,
          "maximum": 100,
          "minimum": 1,
          "type": "integer"
        }
      }
    },
    "schemas": {
      "Error": {
        "properties": {
          "code": {
            "title": "Code",
            "type": "string"
          },
          "correlation_id": {
            "title": "Correlation Id",
            "type": "string"
          },
          "details": {
            "additionalProperties": true,
            "title": "Details",
            "type": "object"
          },
          "message": {
            "title": "Message",
            "type": "string"
          },
          "request_id": {
            "title": "Request Id",
            "type": "string"
          }
        },
        "required": [
          "code",
          "message",
          "request_id",
          "correlation_id"
        ],
        "title": "ApiError",
        "type": "object"
      },
      "Page": {
        "properties": {
          "items": {
            "items": {},
            "type": "array"
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "items",
          "next_cursor"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "keycloakOidc": {
        "openIdConnectUrl": "https://auth.codestra.co/realms/codestra/.well-known/openid-configuration",
        "type": "openIdConnect"
      },
      "productApiKey": {
        "description": "Bearer <product API key>; stored verifiers are never returned.",
        "in": "header",
        "name": "Authorization",
        "type": "apiKey"
      },
      "serviceBearer": {
        "bearerFormat": "JWT",
        "scheme": "bearer",
        "type": "http"
      },
      "serviceMtls": {
        "type": "mutualTLS"
      }
    }
  },
  "info": {
    "title": "Codestra API components",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {}
}
