{
  "components": {
    "schemas": {
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "title": "Detail",
            "type": "array"
          }
        },
        "title": "HTTPValidationError",
        "type": "object"
      },
      "TokenIn": {
        "properties": {
          "email": {
            "format": "email",
            "title": "Email",
            "type": "string"
          },
          "expires_days": {
            "default": 90,
            "maximum": 365.0,
            "minimum": 1.0,
            "title": "Expires Days",
            "type": "integer"
          },
          "scope": {
            "pattern": "^(TENANT_MARKETING|LIST)$",
            "title": "Scope",
            "type": "string"
          },
          "scope_id": {
            "anyOf": [
              {
                "maxLength": 200,
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Scope Id"
          }
        },
        "required": [
          "email",
          "scope"
        ],
        "title": "TokenIn",
        "type": "object"
      },
      "ValidationError": {
        "properties": {
          "ctx": {
            "title": "Context",
            "type": "object"
          },
          "input": {
            "title": "Input"
          },
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "title": "Location",
            "type": "array"
          },
          "msg": {
            "title": "Message",
            "type": "string"
          },
          "type": {
            "title": "Error Type",
            "type": "string"
          }
        },
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError",
        "type": "object"
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "bearerFormat": "JWT or tenant API key",
        "description": "Tenant-bound JWT or API key validated by the gateway.",
        "scheme": "bearer",
        "type": "http"
      },
      "klyrowWebhookSignature": {
        "description": "HMAC-SHA256 signature bound to timestamp, replay ID, and raw body.",
        "in": "header",
        "name": "X-Klyrow-Signature",
        "type": "apiKey"
      },
      "postalSignature": {
        "description": "Postal RSA-SHA256 signature over the raw callback body.",
        "in": "header",
        "name": "X-Postal-Signature-256",
        "type": "apiKey"
      }
    }
  },
