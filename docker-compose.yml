name: klyrow
# All general-email components declare the same disabled baseline. These flags
# describe configuration; native Postal enforcement still requires certification.
x-email-controls: &email-controls
  KLYROW_SAFE_MODE: "true"
  KLYROW_PRODUCTION_GATE_APPROVED: "false"
  LIVE_EMAIL_DELIVERY: "false"
  EXTERNAL_EMAIL_DELIVERY: "false"
  PRODUCTION_PROVIDER_ROUTING: "false"
services:
  gateway:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    env_file: '${KLYROW_ENV_FILE:-.env}'
    environment:
      KLYROW_EMAIL_EVENT_URL: https://middleware-email-events.internal.codestra.agency:18080/internal/provider-events/klyrow
      KLYROW_SERVER_A_CA_FILE: /run/codestra-mtls/server-a/root-ca.crt
      KLYROW_SERVER_A_CLIENT_CERT_FILE: /run/codestra-mtls/server-a/client-fullchain.crt
      KLYROW_SERVER_A_CLIENT_KEY_FILE: /run/codestra-mtls/server-a/client.key
      KLYROW_ENV: production
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SESSION_SECRET_FILE: /run/secrets/klyrow_session_secret
      KLYROW_DURABLE_RESULT_KEYRING_FILE: /run/secrets/klyrow_durable_result_keyring
      KLYROW_POSTAL_API_KEY_FILE: /run/secrets/klyrow_postal_api_key
      KLYROW_METRICS_TOKEN_FILE: /run/secrets/klyrow_metrics_token
      KLYROW_MIDDLEWARE_API_KEY_FILE: /run/secrets/klyrow_middleware_api_key
      KLYROW_WEBHOOK_SECRET_FILE: /run/secrets/klyrow_webhook_secret
      KLYROW_DKIM_KEY_DIR: /var/lib/klyrow/dkim
      KLYROW_CANARY_ALLOWED_DOMAIN: ${KLYROW_CANARY_ALLOWED_DOMAIN:-}
      KLYROW_CANARY_ALLOWED_SENDER: ${KLYROW_CANARY_ALLOWED_SENDER:-}
      KLYROW_CANARY_ALLOWED_RECIPIENT: ${KLYROW_CANARY_ALLOWED_RECIPIENT:-}
      KLYROW_CANARY_MAX_DELIVERIES: ${KLYROW_CANARY_MAX_DELIVERIES:-0}
      KLYROW_REQUIRED_SCHEMA_VERSION: 2026091302_m07_business_event_runtime.sql
      KLYROW_BULK_DELIVERY_ENABLED: "false"
      KLYROW_CAMPAIGN_DELIVERY_ENABLED: "false"
      KLYROW_CAMPAIGN_EXECUTION_MODE: "${KLYROW_CAMPAIGN_EXECUTION_MODE:-CAMPAIGN_EXECUTION_DISABLED}"
      KLYROW_CAMPAIGN_CANARY_ENABLED: "${KLYROW_CAMPAIGN_CANARY_ENABLED:-false}"
      KLYROW_CAMPAIGN_CANARY_MAX_RECIPIENTS: "${KLYROW_CAMPAIGN_CANARY_MAX_RECIPIENTS:-1}"
      KLYROW_CAMPAIGN_CANARY_TENANT_ID: "${KLYROW_CAMPAIGN_CANARY_TENANT_ID:-}"
      KLYROW_CAMPAIGN_CANARY_CAMPAIGN_ID: "${KLYROW_CAMPAIGN_CANARY_CAMPAIGN_ID:-}"
      KLYROW_CAMPAIGN_CANARY_RECIPIENTS: "${KLYROW_CAMPAIGN_CANARY_RECIPIENTS:-}"
      KLYROW_CAMPAIGN_CANARY_SENDER: "${KLYROW_CAMPAIGN_CANARY_SENDER:-}"
      KLYROW_EMBEDDED_WORKERS: "false"
      KLYROW_SAFE_MODE: "true"
      KLYROW_PRODUCTION_GATE_APPROVED: "false"
      KLYROW_REQUIRE_LEAST_PRIVILEGE_DB: "true"
      LIVE_SMS_DELIVERY: "false"
      LIVE_EMAIL_DELIVERY: "false"
      EXTERNAL_SMS_DELIVERY: "false"
      EXTERNAL_EMAIL_DELIVERY: "false"
      PRODUCTION_PROVIDER_ROUTING: "false"
      MARKETING_DELIVERY: "false"
    secrets: [klyrow_durable_result_keyring, klyrow_session_secret, klyrow_postal_api_key, klyrow_metrics_token, klyrow_middleware_api_key, klyrow_webhook_secret, klyrow_database_runtime_password]
    volumes:
      - ./secrets/postal/webhook-signing-public.pem:/run/klyrow/postal-webhook-signing-public.pem:ro
      - /etc/codestra/mtls/server-a-event-client:/run/codestra-mtls/server-a:ro
      - dkim_keys:/var/lib/klyrow/dkim
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:18000:8000"
      - "10.40.0.4:18000:8000"
    networks: [frontend, backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    env_file: '${KLYROW_ENV_FILE:-.env}'
    environment:
      KLYROW_ENV: production
      KLYROW_WORKER_ROLE: mail
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SESSION_SECRET_FILE: /run/secrets/klyrow_session_secret
      KLYROW_POSTAL_API_KEY_FILE: /run/secrets/klyrow_postal_api_key
      KLYROW_MIDDLEWARE_API_KEY_FILE: /run/secrets/klyrow_middleware_api_key
      KLYROW_WEBHOOK_SECRET_FILE: /run/secrets/klyrow_webhook_secret
      KLYROW_POSTAL_API_HOST_HEADER: ${KLYROW_POSTAL_API_HOST_HEADER:-app.klyrow.com}
      KLYROW_EMAIL_EVENT_URL: https://middleware-email-events.internal.codestra.agency:18080/internal/provider-events/klyrow
      KLYROW_SERVER_A_CA_FILE: /run/codestra-mtls/server-a/root-ca.crt
      KLYROW_SERVER_A_CLIENT_CERT_FILE: /run/codestra-mtls/server-a/client-fullchain.crt
      KLYROW_SERVER_A_CLIENT_KEY_FILE: /run/codestra-mtls/server-a/client.key
      KLYROW_CAMPAIGN_EXECUTION_MODE: "${KLYROW_CAMPAIGN_EXECUTION_MODE:-CAMPAIGN_EXECUTION_DISABLED}"
      KLYROW_CAMPAIGN_CANARY_ENABLED: "${KLYROW_CAMPAIGN_CANARY_ENABLED:-false}"
      KLYROW_CAMPAIGN_CANARY_MAX_RECIPIENTS: "${KLYROW_CAMPAIGN_CANARY_MAX_RECIPIENTS:-1}"
      KLYROW_CAMPAIGN_CANARY_TENANT_ID: "${KLYROW_CAMPAIGN_CANARY_TENANT_ID:-}"
      KLYROW_CAMPAIGN_CANARY_CAMPAIGN_ID: "${KLYROW_CAMPAIGN_CANARY_CAMPAIGN_ID:-}"
      KLYROW_CAMPAIGN_CANARY_RECIPIENTS: "${KLYROW_CAMPAIGN_CANARY_RECIPIENTS:-}"
      KLYROW_CAMPAIGN_CANARY_SENDER: "${KLYROW_CAMPAIGN_CANARY_SENDER:-}"
      KLYROW_SAFE_MODE: "true"
      KLYROW_PRODUCTION_GATE_APPROVED: "false"
      LIVE_EMAIL_DELIVERY: "false"
      EXTERNAL_EMAIL_DELIVERY: "false"
      PRODUCTION_PROVIDER_ROUTING: "false"
    command: ["python", "-m", "app.service_worker"]
    secrets: [klyrow_session_secret, klyrow_postal_api_key, klyrow_middleware_api_key, klyrow_webhook_secret, klyrow_database_runtime_password]
    volumes:
      - /etc/codestra/mtls/server-a-event-client:/run/codestra-mtls/server-a:ro
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
    networks: [frontend, backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 20s
      timeout: 5s
      retries: 5
  scheduler:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    environment:
      KLYROW_ENV: production
      KLYROW_WORKER_ROLE: scheduler
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SESSION_SECRET_FILE: /run/secrets/klyrow_session_secret
      KLYROW_DURABLE_RESULT_KEYRING_FILE: /run/secrets/klyrow_durable_result_keyring
      KLYROW_MAUTIC_API_URL: http://mautic
      KLYROW_MAUTIC_API_CLIENT_ID_FILE: /run/secrets/klyrow_mautic_api_client_id
      KLYROW_MAUTIC_API_CLIENT_SECRET_FILE: /run/secrets/klyrow_mautic_api_client_secret
    command: ["python", "-m", "app.service_worker"]
    secrets: [klyrow_durable_result_keyring, klyrow_session_secret, klyrow_mautic_api_client_id, klyrow_mautic_api_client_secret, klyrow_database_runtime_password]
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
      mautic: {condition: service_healthy}
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 20s
      timeout: 5s
      retries: 5
  billing-api:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    env_file: '${KLYROW_ENV_FILE:-.env}'
    environment:
      KLYROW_ENV: production
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SESSION_SECRET_FILE: /run/secrets/klyrow_session_secret
      KLYROW_DURABLE_RESULT_KEYRING_FILE: /run/secrets/klyrow_durable_result_keyring
      KLYROW_METRICS_TOKEN_FILE: /run/secrets/klyrow_metrics_token
      KLYROW_SAFE_MODE: "true"
      KLYROW_EMBEDDED_WORKERS: "false"
    command: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    secrets: [klyrow_durable_result_keyring, klyrow_session_secret, klyrow_metrics_token, klyrow_database_runtime_password]
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 20s
      timeout: 5s
      retries: 5
  billing-worker:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    environment:
      KLYROW_WORKER_ROLE: billing
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SESSION_SECRET_FILE: /run/secrets/klyrow_session_secret
    command: ["python", "-m", "app.service_worker"]
    secrets: [klyrow_session_secret, klyrow_database_runtime_password]
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 20s
      timeout: 5s
      retries: 5
  smtp-relay:
    image: '${KLYROW_GATEWAY_IMAGE:?set the exact protected gateway image by digest}'
    environment:
      <<: *email-controls
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow_runtime@postgres:5432/klyrow
      KLYROW_DATABASE_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
      KLYROW_SMTP_PORT: "8025"
      KLYROW_SMTP_HELO: mail.klyrow.com
      KLYROW_SANDBOX_DOMAIN: klyrow-sink.test
      KLYROW_SAFE_MODE: "true"
      KLYROW_SMTP_TLS_CERT: /run/klyrow/smtp.cert
      KLYROW_SMTP_TLS_KEY: /run/klyrow/smtp.key
    command: ["python", "-m", "app.smtp_relay"]
    user: "999:999"
    volumes:
      - ./secrets/postal/smtp.cert:/run/klyrow/smtp.cert:ro
      - ./secrets/postal/smtp.key:/run/klyrow/smtp.key:ro
    secrets: [klyrow_database_runtime_password]
    depends_on:
      postgres: {condition: service_healthy}
      gateway-migrate: {condition: service_completed_successfully}
    ports: ["10.40.0.4:587:8025"]
    networks: [frontend, backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8025),3); assert s.recv(256).startswith(b'220'); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
  postgres:
    image: '${KLYROW_POSTGRES_IMAGE:?set the approved Postgres image by digest}'
    environment:
      POSTGRES_DB: klyrow
      POSTGRES_USER: klyrow
      POSTGRES_PASSWORD_FILE: /run/secrets/klyrow_database_owner_password
    secrets: [klyrow_database_owner_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U klyrow -d klyrow"]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway-migrate:
    image: '${KLYROW_MIGRATE_IMAGE:?set the exact protected migration image by digest}'
    environment:
      KLYROW_DATABASE_URL: postgresql+psycopg://klyrow@postgres:5432/klyrow
      KLYROW_DATABASE_OWNER_PASSWORD_FILE: /run/secrets/klyrow_database_owner_password
      KLYROW_DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/klyrow_database_runtime_password
    secrets: [klyrow_database_owner_password, klyrow_database_runtime_password]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  mautic-db:
    image: '${KLYROW_MARIADB_IMAGE:?set the approved MariaDB image by digest}'
    environment:
      MARIADB_DATABASE: mautic
      MARIADB_USER: mautic
      MARIADB_PASSWORD: ${MAUTIC_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${MAUTIC_DB_ROOT_PASSWORD:?required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [mautic_db:/var/lib/mysql]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 15
  mautic:
    image: '${KLYROW_MAUTIC_IMAGE:?set the approved Mautic image by digest}'
    environment: &mautic_env
      MAUTIC_DB_HOST: mautic-db
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD:?required}
      MAUTIC_URL: https://app.klyrow.com/mautic
      MAUTIC_RUN_MIGRATIONS: "true"
      MAUTIC_MAILER_DSN: smtp://klyrow:${KLYROW_POSTAL_SERVER_KEY:?required}@postal-smtp:25
      DOCKER_MAUTIC_ROLE: mautic_web
    depends_on:
      mautic-db: {condition: service_healthy}
    volumes: [mautic_data:/var/www/html]
    ports: ["127.0.0.1:18001:80"]
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
  mautic-cron:
    image: '${KLYROW_MAUTIC_IMAGE:?set the approved Mautic image by digest}'
    environment:
      <<: *mautic_env
      DOCKER_MAUTIC_ROLE: mautic_cron
    depends_on:
      mautic: {condition: service_healthy}
    volumes: [mautic_data:/var/www/html]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "php /var/www/html/bin/console doctrine:query:sql 'SELECT 1' --no-interaction >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 5
  mautic-worker:
    image: '${KLYROW_MAUTIC_IMAGE:?set the approved Mautic image by digest}'
    environment:
      <<: *mautic_env
      DOCKER_MAUTIC_ROLE: mautic_worker
    depends_on:
      mautic: {condition: service_healthy}
      postal-smtp: {condition: service_started}
    volumes: [mautic_data:/var/www/html]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "php /var/www/html/bin/console doctrine:query:sql 'SELECT 1' --no-interaction >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 5
  postal-db:
    image: '${KLYROW_MARIADB_IMAGE:?set the approved MariaDB image by digest}'
    environment:
      MARIADB_DATABASE: postal
      MARIADB_USER: postal
      MARIADB_PASSWORD: ${POSTAL_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_PASSWORD:?required}
    volumes: [postal_db:/var/lib/mysql]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 15
  rabbitmq:
    image: '${KLYROW_RABBITMQ_IMAGE:?set the approved RabbitMQ image by digest}'
    environment:
      RABBITMQ_DEFAULT_USER: postal
      RABBITMQ_DEFAULT_PASS: ${POSTAL_RABBITMQ_PASSWORD:?required}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 15
  postal-web:
    image: '${KLYROW_POSTAL_IMAGE:?set the approved Postal image by digest}'
    environment: *email-controls
    command: postal web-server
    volumes: [./secrets/postal:/config:ro, postal_assets:/opt/postal/public]
    depends_on:
      postal-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    ports: ["127.0.0.1:18002:5000"]
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "ruby -rnet/http -e 'r=Net::HTTP.get_response(URI(\"http://127.0.0.1:5000/\")); exit(r.code.to_i < 500 ? 0 : 1)'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
  postal-worker:
    image: '${KLYROW_POSTAL_IMAGE:?set the approved Postal image by digest}'
    environment: *email-controls
    command: postal worker
    volumes: [./secrets/postal:/config:ro]
    depends_on:
      postal-web: {condition: service_healthy}
    # Postal worker needs egress for recipient MX resolution and delivery.
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "ruby -rsocket -e \"[['rabbitmq',5672],['postal-db',3306]].each{|h,p| s=TCPSocket.new(h,p);s.close}\"" ]
      interval: 30s
      timeout: 5s
      retries: 5
  postal-smtp:
    image: '${KLYROW_POSTAL_IMAGE:?set the approved Postal image by digest}'
    environment: *email-controls
    command: postal smtp-server
    volumes: [./secrets/postal:/config:ro]
    depends_on:
      postal-web: {condition: service_healthy}
    # Standard MX/submission SMTP with STARTTLS; retain loopback diagnostics.
    ports: ["37.27.128.39:25:25", "127.0.0.1:2525:25"]
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "ruby -rsocket -rnet/http -e \"[['rabbitmq',5672],['postal-db',3306]].each{|h,p| s=TCPSocket.new(h,p);s.close};raise unless Net::HTTP.get_response(URI('http://127.0.0.1:9091/')).code.to_i<500\"" ]
      interval: 30s
      timeout: 5s
      retries: 5
  prometheus:
    image: '${KLYROW_PROMETHEUS_IMAGE:?set the approved Prometheus image by digest}'
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=30d]
    volumes: [./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./config/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus_data:/prometheus]
    secrets: [klyrow_metrics_token]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 5
  grafana:
    image: '${KLYROW_GRAFANA_IMAGE:?set the approved Grafana image by digest}'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_SERVER_ROOT_URL: https://app.klyrow.com/ops/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["127.0.0.1:18003:3000"]
    networks: [frontend, backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 5
  node-exporter:
    image: '${KLYROW_NODE_EXPORTER_IMAGE:?set the approved node-exporter image by digest}'
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave
    networks: [backend]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9100/metrics]
      interval: 30s
      timeout: 5s
      retries: 5
networks:
  frontend: {}
  backend: {internal: true}
volumes:
  postgres_data: {}
  mautic_db: {}
  mautic_data: {}
  postal_db: {}
  rabbitmq_data: {}
  postal_assets: {}
  prometheus_data: {}
  grafana_data: {}
  dkim_keys: {}
secrets:
  klyrow_durable_result_keyring:
    file: '${KLYROW_DURABLE_RESULT_KEYRING_FILE:?set the root-owned durable-result keyring path}'
  klyrow_database_owner_password:
    file: '${KLYROW_DATABASE_OWNER_PASSWORD_FILE:?set the root-owned database owner password path}'
  klyrow_database_runtime_password:
    file: '${KLYROW_DATABASE_RUNTIME_PASSWORD_FILE:?set the root-owned database runtime password path}'
  klyrow_session_secret:
    file: '${KLYROW_SESSION_SECRET_FILE:?set the root-owned session secret path}'
  klyrow_postal_api_key:
    file: '${KLYROW_POSTAL_API_KEY_FILE:?set the root-owned Postal API key path}'
  klyrow_metrics_token:
    file: '${KLYROW_METRICS_TOKEN_FILE:?set the root-owned metrics token path}'
  klyrow_middleware_api_key:
    file: '${KLYROW_MIDDLEWARE_API_KEY_FILE:?set the root-owned Middleware API key path}'
  klyrow_webhook_secret:
    file: '${KLYROW_WEBHOOK_SECRET_FILE:?set the root-owned webhook secret path}'
  klyrow_mautic_api_client_id:
    file: '${KLYROW_MAUTIC_API_CLIENT_ID_FILE:?set the root-owned Mautic OAuth client ID path}'
  klyrow_mautic_api_client_secret:
    file: '${KLYROW_MAUTIC_API_CLIENT_SECRET_FILE:?set the root-owned Mautic OAuth client secret path}'
