name: Codestra deploy readiness

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      operation:
        description: Verify, release, stage/certify read-only, or promote a read-only canary
        required: true
        type: choice
        default: verify
        options:
          - verify
          - release
          - deploy-staging-readonly
          - certify-staging-readonly
          - promote-production-readonly
      confirmation:
        description: Fixed confirmation required for deployment operations
        required: false
        type: string
        default: ""
      canary_percent:
        description: Read-only canary percentage; maximum 1
        required: false
        type: string
        default: "1"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  deploy-readiness:
    uses: ./.github/workflows/reusable-codestra-deploy-readiness.yml
    with:
      repository_class: application
      run_stack_tests: false
      # The canonical release workflow publishes the gateway, web, migration,
      # and provisioner images independently. A generic single-Dockerfile
      # image is not a deployable representation of this monorepo.
      artifact_strategy: source-bundle
      runtime_deployable: true
      health_paths: "/healthz,/readyz,/version"
      operation: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'verify' }}
      confirmation: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      canary_percent: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_percent || '1' }}

  source-ci:
    permissions:
      contents: read
    name: deploy-readiness / source-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Validate non-mutating staging contracts
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 pytest==8.4.2
          python -m pytest -q tests/test_staging_environment_contract.py
          bash -n scripts/staging-preflight scripts/staging-deploy
          docker compose --env-file deploy/staging/staging.env.example \
            -f deploy/staging/compose.yml config --quiet
