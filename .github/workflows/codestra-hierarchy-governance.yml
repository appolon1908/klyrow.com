name: Codestra Hierarchy Governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hierarchy-governance:
    name: hierarchy-governance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate source governance manifest
        shell: python
        run: |
          import pathlib, yaml
          p = pathlib.Path(".codestra/control-plane.yml")
          if not p.exists():
              raise SystemExit("missing source governance manifest")
          data = yaml.safe_load(p.read_text())
          if data["authority"].get("source") != "github_actions_and_repository_protections":
              raise SystemExit("source authority must remain native GitHub")
          if data["promotion"]["chain"] != ["development","testing","staging","production"]:
              raise SystemExit("invalid promotion chain")
          if data["promotion"].get("force_push_allowed") is not False:
              raise SystemExit("force pushes must remain disabled")
          for key in ("require_exact_sha", "require_clean_worktree", "require_review"):
              if data["promotion"].get(key) is not True:
                  raise SystemExit(f"{key} must remain true")
          for key in ("production_go","live_capabilities_enabled","external_effects_enabled"):
              if data["effects"].get(key) is not False:
                  raise SystemExit(f"{key} must remain false")
          sections = data.get("sections", [])
          if len(sections) != 8:
              raise SystemExit("expected 8 governed workstation sections")
          print("hierarchy governance PASS")
