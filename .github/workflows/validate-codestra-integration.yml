name: Validate Codestra integration files

on:
  pull_request:
    paths:
      - "codestra/integration/**"
      - "monitoring/klyrow-metrics-contract.v1.json"
      - "monitoring/codestra-observability-boundary.v1.json"
      - "monitoring/kyyow-observability-sync-v1.json"
      - "monitoring/prometheus-target.disabled.yml"
      - "monitoring/klyrow-recording-rules.yml"
      - "docs/CODESTRA-INTEGRATION-FILES.md"
      - "docs/OBSERVABILITY_INTEGRATION.md"
      - "scripts/validate-codestra-integration.py"
      - "apps/gateway/app/capabilities.py"
      - "apps/gateway/app/main.py"
      - "apps/gateway/app/observability.py"
      - "apps/gateway/app/service_worker.py"
      - "apps/gateway/app/production_api.py"
      - "deploy/docker-compose.observability.yml"
      - "apps/gateway/app/openapi_authority.py"
      - "tests/test_codestra_integration_files.py"
      - "tests/test_contract_conformance.py"
      - "tests/test_observability_integration.py"
      - "tests/test_observability_integration_postgres.py"
      - ".github/workflows/validate-codestra-integration.yml"
  push:
    branches:
      - "codex/klyrow-smtp-integration-files"
      - "phase-s0/contract-conformance"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable Middleware observability contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: appolon1908-hue/Middleware-
          ref: 61d899f98048f4465303cdcb616a4c9f5a35ceb5
          path: .ci-middleware-observability
          sparse-checkout: |
            contracts/observability/odoo-sync.v1.json
            app/api/v1/observability_sync.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify vendored Middleware contract bytes
        run: cmp .ci-middleware-observability/contracts/observability/odoo-sync.v1.json monitoring/kyyow-observability-sync-v1.json
      - name: Verify pinned Middleware consumer implementation
        run: |
          test "$(git hash-object .ci-middleware-observability/app/api/v1/observability_sync.py)" = "8748512f71d3856785abb5113e056eb975102421"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Validate integration files
        run: python scripts/validate-codestra-integration.py
      - name: Run contract conformance checks
        run: python -m pytest -q tests/test_contract_conformance.py
