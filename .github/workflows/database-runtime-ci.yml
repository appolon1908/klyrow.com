name: Klyrow PostgreSQL runtime CI

on:
  pull_request:
    paths:
      - docker/database-runtime.Dockerfile
      - .github/workflows/database-runtime-ci.yml
      - tests/test_database_runtime_image_contract.py
      - docs/runtime/POSTGRES_HARDENED_RUNTIME.md
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  KLYROW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: postgres-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q tests/test_database_runtime_image_contract.py

  image:
    needs: [contract]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: source
        name: Bind source and reproducible epoch
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$KLYROW_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build PostgreSQL runtime candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/database-runtime.Dockerfile
          target: postgres-runtime
          load: true
          push: false
          tags: klyrow-postgres:${{ env.KLYROW_SOURCE_SHA }}
          build-args: |
            SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Verify inherited entrypoint and OCI source identity
        run: |
          set -Eeuo pipefail
          image="klyrow-postgres:${KLYROW_SOURCE_SHA}"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$KLYROW_SOURCE_SHA"
          test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["docker-entrypoint.sh"]'
          test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["postgres"]'
          test -z "$(docker image inspect "$image" --format '{{.Config.User}}')"
          docker run --rm "$image" gosu --version | grep -F '1.19 (go1.25.13 '
          test "$(docker run --rm "$image" postgres --version | awk '{print $3}' | cut -d. -f1)" = "17"

      - name: Rehearse fresh volume, signal stop, and restart
        env:
          IMAGE: klyrow-postgres:${{ env.KLYROW_SOURCE_SHA }}
          CONTAINER: klyrow-postgres-runtime-ci
          VOLUME: klyrow-postgres-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          PASSWORD_FILE: ${{ runner.temp }}/klyrow-postgres-password
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
            shred -u "$PASSWORD_FILE" >/dev/null 2>&1 || rm -f "$PASSWORD_FILE"
          }
          trap cleanup EXIT
          umask 077
          printf '%s' 'ci-only-postgres-runtime-password' > "$PASSWORD_FILE"
          docker volume create "$VOLUME" >/dev/null
          docker run --detach \
            --name "$CONTAINER" \
            --mount "type=volume,src=$VOLUME,dst=/var/lib/postgresql/data" \
            --mount "type=bind,src=$PASSWORD_FILE,dst=/run/secrets/postgres_password,readonly" \
            --env POSTGRES_DB=klyrow \
            --env POSTGRES_USER=klyrow \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
            "$IMAGE" >/dev/null

          # The entrypoint bootstrap server accepts only Unix-socket connections.
          # Wait for the final TCP listener before checking PID 1 or writing data.
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER" pg_isready -h 127.0.0.1 -U klyrow -d klyrow >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec "$CONTAINER" sh -ceu '
            awk '\''/^Uid:/{exit !($2 != 0)}'\'' /proc/1/status
            awk '\''/^Gid:/{exit !($2 != 0)}'\'' /proc/1/status
            test "$(stat -c %U:%G /var/lib/postgresql/data)" = postgres:postgres
            tr "\000" " " </proc/1/cmdline | grep -E "^postgres( |$)"
          '
          docker exec "$CONTAINER" psql -U klyrow -d klyrow -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE runtime_rehearsal (id integer primary key); INSERT INTO runtime_rehearsal VALUES (1);" >/dev/null

          docker stop --time 30 "$CONTAINER" >/dev/null
          test "$(docker inspect "$CONTAINER" --format '{{.State.ExitCode}}')" = 0
          docker start "$CONTAINER" >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER" pg_isready -h 127.0.0.1 -U klyrow -d klyrow >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(docker exec "$CONTAINER" psql -U klyrow -d klyrow -Atqc 'SELECT count(*) FROM runtime_rehearsal')" = 1

      - name: Scan PostgreSQL candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-postgres:${{ env.KLYROW_SOURCE_SHA }}
          format: sarif
          output: trivy-postgres.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Retain PostgreSQL vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-postgres-${{ env.KLYROW_SOURCE_SHA }}
          path: trivy-postgres.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Generate PostgreSQL CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-postgres:${{ env.KLYROW_SOURCE_SHA }}
          format: cyclonedx-json
          output-file: klyrow-postgres-${{ env.KLYROW_SOURCE_SHA }}.cdx.json
          upload-artifact: true

      - name: Verify reproducible PostgreSQL OCI bytes
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        run: |
          set -Eeuo pipefail
          for copy in a b; do
            docker buildx build \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --target postgres-runtime \
              --build-arg "SOURCE_COMMIT_SHA=${KLYROW_SOURCE_SHA}" \
              --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
              --output "type=oci,dest=${RUNNER_TEMP}/klyrow-postgres-${copy}.tar,rewrite-timestamp=true" \
              --file docker/database-runtime.Dockerfile \
              .
          done
          cmp \
            "${RUNNER_TEMP}/klyrow-postgres-a.tar" \
            "${RUNNER_TEMP}/klyrow-postgres-b.tar"
          sha256sum "${RUNNER_TEMP}/klyrow-postgres-a.tar"
