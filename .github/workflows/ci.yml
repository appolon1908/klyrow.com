name: Klyrow gateway CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  KLYROW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: pip install -r apps/gateway/requirements.txt openapi-spec-validator pytest
      - name: Verify composed API catalog and audience exports
        run: |
          python scripts/export-api-contracts.py --check
          python scripts/validate-api-contracts.py
          python scripts/export-event-contracts.py --check
          pytest -q tests/test_api_contract_compatibility.py tests/test_mission_api_boundaries.py tests/test_odoo_writer_architecture.py
      - name: Validate AsyncAPI, JSON Schema and event examples
        run: |
          npm ci --ignore-scripts --prefix tools/contracts
          npm test --prefix tools/contracts
      - name: Reject contract changes against the pull request base
        if: github.event_name == 'pull_request'
        env:
          KLYROW_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/validate-api-contracts.py --base-ref "$KLYROW_CONTRACT_BASE_SHA"
          python scripts/check-event-compatibility.py --base-ref "$KLYROW_CONTRACT_BASE_SHA"
      - name: Generate and compile public TypeScript client types
        run: |
          npx --yes --package=openapi-typescript@7.10.1 openapi-typescript schemas/openapi/klyrow-public-api.yaml -o /tmp/klyrow-api.d.ts
          cmp /tmp/klyrow-api.d.ts sdk/typescript/src/schema.d.ts
          npx --yes --package=typescript@5.9.2 tsc --noEmit --strict --lib es2022,dom sdk/typescript/src/index.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:routes
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: klyrow_ci
          POSTGRES_USER: klyrow
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klyrow -d klyrow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/gateway/requirements.txt
      - name: Install gateway and test dependencies
        run: pip install -r apps/gateway/requirements.txt pytest pip-audit openapi-spec-validator
      - name: Audit Python dependencies
        run: pip-audit --requirement apps/gateway/requirements.txt
      - name: Apply migrations twice and verify the ledger
        env:
          KLYROW_DATABASE_URL: postgresql+psycopg://klyrow@127.0.0.1:5432/klyrow_ci
          KLYROW_DATABASE_OWNER_PASSWORD_FILE: ${{ runner.temp }}/klyrow-db-owner-password
          KLYROW_DATABASE_RUNTIME_PASSWORD_FILE: ${{ runner.temp }}/klyrow-db-runtime-password
        run: |
          umask 077
          printf '%s' 'ci-only-password' > "$KLYROW_DATABASE_OWNER_PASSWORD_FILE"
          printf '%s' 'ci-runtime-only-password' > "$KLYROW_DATABASE_RUNTIME_PASSWORD_FILE"
          cleanup() { shred -u "$KLYROW_DATABASE_OWNER_PASSWORD_FILE" "$KLYROW_DATABASE_RUNTIME_PASSWORD_FILE"; }
          trap cleanup EXIT
          python scripts/migrate
          python scripts/migrate
          python - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          runtime_url = make_url(os.environ["KLYROW_DATABASE_URL"]).set(
              username="klyrow_runtime",
              password=Path(os.environ["KLYROW_DATABASE_RUNTIME_PASSWORD_FILE"]).read_text(),
          )
          with create_engine(runtime_url).connect() as connection:
              count = connection.execute(text("SELECT count(*) FROM klyrow_schema_migrations")).scalar_one()
              expected = sum(1 for _ in __import__("pathlib").Path("migrations").glob("*.sql"))
              assert count == expected, (count, expected)
              role = connection.execute(text("SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls FROM pg_roles WHERE rolname=current_user")).one()
              assert role[0] == "klyrow_runtime" and not any(role[1:]), role
          PY
      - name: Compile and test
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q apps/gateway
          pytest -q tests
      - name: Verify command replay under concurrent PostgreSQL transactions
        env:
          KLYROW_CONTRACT_POSTGRES_URL: postgresql+psycopg://klyrow:ci-only-password@127.0.0.1:5432/klyrow_ci
        run: python -m pytest -q tests/test_middleware_email_contract.py tests/test_durable_operation_results.py tests/test_customer_event_postgres.py tests/test_platform_owner_api.py tests/test_usage_history.py tests/test_business_events_postgres.py tests/test_observability_integration_postgres.py
      - name: Checkout immutable Middleware contract dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: appolon1908-hue/Middleware-
          ref: 8336a9de25fe7cf6c6af720ac1f79e98ed345f02
          path: .ci-middleware
          persist-credentials: false
      - name: Verify owned Middleware adapters against the gateway
        run: |
          pip install temporalio==1.32.0 asyncpg==0.30.0 pydantic-settings==2.15.0 pytest-asyncio==1.4.0
          python scripts/verify_middleware_contract.py .ci-middleware

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [frontend, test, secrets, contracts]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Bind reproducible build epoch to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build backend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: klyrow-gateway:${{ env.KLYROW_SOURCE_SHA }}
          build-args: SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Build migration candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          load: true
          tags: klyrow-migrate:${{ env.KLYROW_SOURCE_SHA }}
          build-args: SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Build Postal provisioner candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postal-provisioner.Dockerfile
          load: true
          tags: klyrow-postal-provisioner:${{ env.KLYROW_SOURCE_SHA }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SOURCE_SHA=${{ env.KLYROW_SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Build frontend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: klyrow-web:${{ env.KLYROW_SOURCE_SHA }}
          build-args: SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Verify composed browser edge and canonical callback
        env:
          EDGE_NETWORK: klyrow-auth-edge-ci
          GATEWAY_IMAGE: klyrow-gateway:${{ env.KLYROW_SOURCE_SHA }}
          WEB_IMAGE: klyrow-web:${{ env.KLYROW_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f klyrow-web-edge-ci klyrow-gateway-edge-ci >/dev/null 2>&1 || true
            docker network rm "$EDGE_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$EDGE_NETWORK"
          docker run --rm -d \
            --network "$EDGE_NETWORK" \
            --network-alias gateway \
            --name klyrow-gateway-edge-ci \
            --tmpfs /tmp \
            --env KLYROW_ENV=development \
            --env KLYROW_DATABASE_URL=sqlite:////tmp/klyrow-edge.db \
            --env KLYROW_SESSION_SECRET=klyrow-auth-edge-ci-session-secret-2026 \
            --env KLYROW_SAFE_MODE=true \
            --env KLYROW_EMBEDDED_WORKERS=false \
            --env LIVE_EMAIL_DELIVERY=false \
            --env EXTERNAL_EMAIL_DELIVERY=false \
            --env PRODUCTION_PROVIDER_ROUTING=false \
            --env KLYROW_PUBLIC_URL=https://app.klyrow.com \
            --env KLYROW_OIDC_REDIRECT_URI=https://app.klyrow.com/auth/callback \
            "$GATEWAY_IMAGE"
          docker run --rm -d \
            --network "$EDGE_NETWORK" \
            --name klyrow-web-edge-ci \
            --publish 127.0.0.1:18014:8080 \
            "$WEB_IMAGE"

          ready=false
          for _attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null \
              --header "Host: app.klyrow.com" \
              http://127.0.0.1:18014/auth/session; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          KLYROW_EDGE_BASE_URL=http://127.0.0.1:18014 scripts/verify-browser-edge

      - name: Scan backend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-gateway:${{ env.KLYROW_SOURCE_SHA }}
          format: sarif
          output: trivy-gateway.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-web:${{ env.KLYROW_SOURCE_SHA }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan migration candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-migrate:${{ env.KLYROW_SOURCE_SHA }}
          format: sarif
          output: trivy-migrate.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Postal provisioner candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: klyrow-postal-provisioner:${{ env.KLYROW_SOURCE_SHA }}
          format: sarif
          output: trivy-postal-provisioner.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Retain Trivy scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ env.KLYROW_SOURCE_SHA }}
          path: |
            trivy-gateway.sarif
            trivy-web.sarif
            trivy-migrate.sarif
            trivy-postal-provisioner.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Generate backend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-gateway:${{ env.KLYROW_SOURCE_SHA }}
          format: cyclonedx-json
          output-file: klyrow-gateway-${{ env.KLYROW_SOURCE_SHA }}.cdx.json
          upload-artifact: true

      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-web:${{ env.KLYROW_SOURCE_SHA }}
          format: cyclonedx-json
          output-file: klyrow-web-${{ env.KLYROW_SOURCE_SHA }}.cdx.json
          upload-artifact: true

      - name: Generate migration CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-migrate:${{ env.KLYROW_SOURCE_SHA }}
          format: cyclonedx-json
          output-file: klyrow-migrate-${{ env.KLYROW_SOURCE_SHA }}.cdx.json
          upload-artifact: true

      - name: Generate Postal provisioner CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: klyrow-postal-provisioner:${{ env.KLYROW_SOURCE_SHA }}
          format: cyclonedx-json
          output-file: klyrow-postal-provisioner-${{ env.KLYROW_SOURCE_SHA }}.cdx.json
          upload-artifact: true

      - name: Verify reproducible OCI image bytes
        run: |
          set -euo pipefail
          declare -A dockerfiles=(
            [gateway]="apps/gateway/Dockerfile"
            [web]="apps/web/Dockerfile"
            [migrate]="docker/migrate.Dockerfile"
            [postal-provisioner]="docker/postal-provisioner.Dockerfile"
          )
          for image in gateway web migrate postal-provisioner; do
            dockerfile="${dockerfiles[$image]}"
            for copy in a b; do
              docker buildx build \
                --no-cache \
                --provenance=false \
                --sbom=false \
                --build-arg "SOURCE_COMMIT_SHA=${KLYROW_SOURCE_SHA}" \
                --build-arg "SOURCE_SHA=${KLYROW_SOURCE_SHA}" \
                --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
                --output "type=oci,dest=${RUNNER_TEMP}/klyrow-${image}-${copy}.tar,rewrite-timestamp=true" \
                --file "${dockerfile}" \
                .
            done
            cmp \
              "${RUNNER_TEMP}/klyrow-${image}-a.tar" \
              "${RUNNER_TEMP}/klyrow-${image}-b.tar"
            sha256sum "${RUNNER_TEMP}/klyrow-${image}-a.tar"
          done

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.KLYROW_SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: source
        name: Bind reproducible build epoch to protected source commit
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'appolon1908-hue/klyrow.com'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$(git rev-parse HEAD)" = "$KLYROW_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - id: push_gateway
        name: Publish backend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-gateway:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - id: push_web
        name: Publish frontend candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-web:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - id: push_migrate
        name: Publish migration candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-migrate:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_COMMIT_SHA=${{ env.KLYROW_SOURCE_SHA }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - id: push_postal_provisioner
        name: Publish Postal provisioner candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/postal-provisioner.Dockerfile
          outputs: type=registry,rewrite-timestamp=true
          tags: ghcr.io/${{ github.repository_owner }}/klyrow-postal-provisioner:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_SHA=${{ env.KLYROW_SOURCE_SHA }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.KLYROW_SOURCE_SHA }}

      - name: Pull exact candidates for release evidence
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-gateway@${GATEWAY_DIGEST}"
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-web@${WEB_DIGEST}"
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-migrate@${MIGRATE_DIGEST}"
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-postal-provisioner@${POSTAL_PROVISIONER_DIGEST}"

      - name: Scan exact backend digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/klyrow-gateway@${{ steps.push_gateway.outputs.digest }}
          format: json
          output: publish-trivy-gateway.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan exact frontend digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/klyrow-web@${{ steps.push_web.outputs.digest }}
          format: json
          output: publish-trivy-web.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan exact migration digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/klyrow-migrate@${{ steps.push_migrate.outputs.digest }}
          format: json
          output: publish-trivy-migrate.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan exact Postal provisioner digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/klyrow-postal-provisioner@${{ steps.push_postal_provisioner.outputs.digest }}
          format: json
          output: publish-trivy-postal-provisioner.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate exact backend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/klyrow-gateway@${{ steps.push_gateway.outputs.digest }}
          format: spdx-json
          output-file: publish-sbom-gateway.spdx.json
          upload-artifact: false

      - name: Generate exact frontend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/klyrow-web@${{ steps.push_web.outputs.digest }}
          format: spdx-json
          output-file: publish-sbom-web.spdx.json
          upload-artifact: false

      - name: Generate exact migration SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/klyrow-migrate@${{ steps.push_migrate.outputs.digest }}
          format: spdx-json
          output-file: publish-sbom-migrate.spdx.json
          upload-artifact: false

      - name: Generate exact Postal provisioner SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/klyrow-postal-provisioner@${{ steps.push_postal_provisioner.outputs.digest }}
          format: spdx-json
          output-file: publish-sbom-postal-provisioner.spdx.json
          upload-artifact: false

      - name: Bind vulnerability, provenance, and SBOM evidence
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
        run: |
          set -Eeuo pipefail
          for image in gateway web migrate postal-provisioner; do
            test "$(jq '[.Results[].Vulnerabilities[]?] | length' "publish-trivy-${image}.json")" = 0
            jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
              "publish-sbom-${image}.spdx.json"
          done
          for item in \
            "gateway|$GATEWAY_DIGEST" \
            "web|$WEB_DIGEST" \
            "migrate|$MIGRATE_DIGEST" \
            "postal-provisioner|$POSTAL_PROVISIONER_DIGEST"; do
            IFS='|' read -r image digest <<< "$item"
            jq -n \
              --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
              --arg source "$KLYROW_SOURCE_SHA" \
              --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}" \
              --arg digest "$digest" \
              --arg invocation "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
              '{
                buildDefinition: {
                  buildType: "https://codestra.co/build-types/github-protected-main/v1",
                  externalParameters: {
                    repository: $repository,
                    sourceCommit: $source,
                    registryImage: $image,
                    registryDigest: $digest
                  },
                  internalParameters: {protectedRef: "refs/heads/main"},
                  resolvedDependencies: [{
                    uri: ("git+" + $repository + "@refs/heads/main"),
                    digest: {gitCommit: $source}
                  }]
                },
                runDetails: {
                  builder: {id: ($repository + "/actions")},
                  metadata: {invocationId: $invocation},
                  byproducts: []
                }
              }' > "publish-provenance-${image}.json"
          done

      - id: release_state
        name: Reject immutable source-tag collisions before signing
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
        run: |
          set -Eeuo pipefail
          for item in \
            "gateway|$GATEWAY_DIGEST" \
            "web|$WEB_DIGEST" \
            "migrate|$MIGRATE_DIGEST" \
            "postal_provisioner|$POSTAL_PROVISIONER_DIGEST"; do
            IFS='|' read -r key digest <<< "$item"
            image="${key//_/-}"
            final_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}:${KLYROW_SOURCE_SHA}"
            if existing="$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              test "$existing" = "$digest"
              echo "${key}_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}_exists=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3

      - name: Sign and attest only unpublished exact digests
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
          GATEWAY_EXISTS: ${{ steps.release_state.outputs.gateway_exists }}
          WEB_EXISTS: ${{ steps.release_state.outputs.web_exists }}
          MIGRATE_EXISTS: ${{ steps.release_state.outputs.migrate_exists }}
          POSTAL_PROVISIONER_EXISTS: ${{ steps.release_state.outputs.postal_provisioner_exists }}
          SIGNING_IDENTITY: https://github.com/appolon1908-hue/klyrow.com/.github/workflows/ci.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          for item in \
            "gateway|$GATEWAY_DIGEST|$GATEWAY_EXISTS" \
            "web|$WEB_DIGEST|$WEB_EXISTS" \
            "migrate|$MIGRATE_DIGEST|$MIGRATE_EXISTS" \
            "postal-provisioner|$POSTAL_PROVISIONER_DIGEST|$POSTAL_PROVISIONER_EXISTS"; do
            IFS='|' read -r image digest published <<< "$item"
            exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}@${digest}"
            test "$published" != true || continue
            if ! cosign verify --certificate-identity "$SIGNING_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$exact_image" >/dev/null 2>&1; then
              cosign sign --yes "$exact_image"
            fi
            if ! cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity "$SIGNING_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$exact_image" 2>/dev/null | jq -s -e --arg source "$KLYROW_SOURCE_SHA" --arg digest "$digest" '
                [.[] | if type == "array" then .[] else . end] | any(.[];
                  ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.sourceCommit == $source) and
                  ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.registryDigest == $digest)
                )' >/dev/null; then
              cosign attest --yes --type slsaprovenance1 \
                --predicate "publish-provenance-${image}.json" "$exact_image"
            fi
            if ! cosign verify-attestation --type spdxjson \
              --certificate-identity "$SIGNING_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$exact_image" 2>/dev/null | \
              jq -s -e '[.[] | if type == "array" then .[] else . end] | any(.[]; ((.payload | @base64d | fromjson).predicate.spdxVersion == "SPDX-2.3"))' >/dev/null; then
              cosign attest --yes --type spdxjson \
                --predicate "publish-sbom-${image}.spdx.json" "$exact_image"
            fi
          done

      - name: Verify signatures, provenance, and SBOM attestations
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
          SIGNING_IDENTITY: https://github.com/appolon1908-hue/klyrow.com/.github/workflows/ci.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          for item in \
            "gateway|$GATEWAY_DIGEST" \
            "web|$WEB_DIGEST" \
            "migrate|$MIGRATE_DIGEST" \
            "postal-provisioner|$POSTAL_PROVISIONER_DIGEST"; do
            IFS='|' read -r image digest <<< "$item"
            exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}@${digest}"
            cosign verify --certificate-identity "$SIGNING_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$exact_image" \
              > "publish-signature-verification-${image}.json"
            cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity "$SIGNING_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$exact_image" > "publish-provenance-verification-${image}.json"
            cosign verify-attestation --type spdxjson \
              --certificate-identity "$SIGNING_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$exact_image" > "publish-sbom-verification-${image}.json"
            jq -e 'length > 0' "publish-signature-verification-${image}.json"
            jq -s -e --arg source "$KLYROW_SOURCE_SHA" --arg digest "$digest" '
              [.[] | if type == "array" then .[] else . end] | any(.[];
                ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.sourceCommit == $source) and
                ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.registryDigest == $digest)
              )' "publish-provenance-verification-${image}.json"
            jq -s -e '[.[] | if type == "array" then .[] else . end] | any(.[]; ((.payload | @base64d | fromjson).predicate.spdxVersion == "SPDX-2.3"))' \
              "publish-sbom-verification-${image}.json"
          done

      - name: Promote only fully certified digests to immutable source tags
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
        run: |
          set -Eeuo pipefail
          for item in \
            "gateway|$GATEWAY_DIGEST" \
            "web|$WEB_DIGEST" \
            "migrate|$MIGRATE_DIGEST" \
            "postal-provisioner|$POSTAL_PROVISIONER_DIGEST"; do
            IFS='|' read -r image digest <<< "$item"
            exact_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}@${digest}"
            final_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/klyrow-${image}:${KLYROW_SOURCE_SHA}"
            if existing="$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              test "$existing" = "$digest"
            else
              docker buildx imagetools create --prefer-index=false --tag "$final_image" "$exact_image"
            fi
            test "$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}')" = "$digest"
          done

      - name: Checksum and retain exact release evidence
        env:
          GATEWAY_DIGEST: ${{ steps.push_gateway.outputs.digest }}
          WEB_DIGEST: ${{ steps.push_web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push_migrate.outputs.digest }}
          POSTAL_PROVISIONER_DIGEST: ${{ steps.push_postal_provisioner.outputs.digest }}
        run: |
          set -Eeuo pipefail
          echo "$KLYROW_SOURCE_SHA" > PUBLISH_SOURCE_SHA
          jq -n \
            --arg gateway "$GATEWAY_DIGEST" \
            --arg web "$WEB_DIGEST" \
            --arg migrate "$MIGRATE_DIGEST" \
            --arg postal_provisioner "$POSTAL_PROVISIONER_DIGEST" \
            '{gateway: $gateway, web: $web, migrate: $migrate, postal_provisioner: $postal_provisioner}' \
            > PUBLISH_IMAGE_DIGESTS.json
          sha256sum PUBLISH_SOURCE_SHA PUBLISH_IMAGE_DIGESTS.json \
            publish-trivy-*.json publish-sbom-*.spdx.json publish-provenance-*.json \
            publish-signature-verification-*.json publish-provenance-verification-*.json \
            publish-sbom-verification-*.json > PUBLISH_SHA256SUMS
          sha256sum -c PUBLISH_SHA256SUMS

      - name: Upload checksummed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klyrow-release-${{ env.KLYROW_SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            PUBLISH_SOURCE_SHA
            PUBLISH_IMAGE_DIGESTS.json
            PUBLISH_SHA256SUMS
            publish-trivy-*.json
            publish-sbom-*.spdx.json
            publish-provenance-*.json
            publish-signature-verification-*.json
            publish-provenance-verification-*.json
            publish-sbom-verification-*.json
